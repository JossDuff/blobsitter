name: ci

on:
  push:
  pull_request:

jobs:
  # The committed vectors must be exactly what the generator produces — no hand edits,
  # no stale files after a spec change.
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/gen_vectors.py
      - run: git diff --exit-code vectors/

  # The contracts must build, pass the full forge suite (vector conformance, negative
  # tests, invariants incl. the ffi differential against the Rust reference), and be
  # forge-fmt clean.
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: foundry-rs/foundry-toolchain@v1
      # The I12 differential fuzz test shells out to this oracle via vm.ffi.
      - run: cargo build -p blobsitter-reference --bin mmr_oracle
      - run: forge fmt --check
        working-directory: contracts
      - run: forge build
        working-directory: contracts
      # Fork tests (test/fork/*) self-skip unless ETH_RPC_URL is set; add the repo
      # secret to enable them in CI. They always work locally with an exported URL.
      - run: forge test -vv
        working-directory: contracts
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
      # Informational for now; a coverage gate threshold is a pre-audit decision.
      - run: forge coverage --report summary --ir-minimum
        working-directory: contracts
        continue-on-error: true

  # The guest logic (the exact code the circuits prove) must pass its native tests
  # against the committed vectors. No SP1 toolchain involved: the guest binaries are
  # thin wrappers, and everything they assert lives in the host-buildable common crate.
  # Executor benchmarks and vkey derivation are local-only (see circuits/BENCHMARKS.md).
  circuits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: circuits
      - run: cargo test --manifest-path circuits/Cargo.toml

  # The reference implementation must agree with the committed vectors, and the
  # daemon suite (Layers 1–2) must pass. Foundry is installed and the contracts
  # built so the Layer-2 anvil tests run for real instead of self-skipping.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build
        working-directory: contracts
      # BLOBSITTER_REQUIRE_L2 turns the anvil tests' local self-skip into a hard
      # failure: CI must never silently lose end-to-end coverage to a path drift.
      - run: cargo test --workspace
        env:
          BLOBSITTER_REQUIRE_L2: "1"
      # D6 — the daemon must never grow an app-layer dependency.
      - run: ./scripts/check_daemon_opacity.sh
      # The committed KZG fixture must be exactly what the generator produces.
      - run: cargo run -p kzg-fixture
      - run: git diff --exit-code contracts/test/fixtures/
      - run: cargo clippy --workspace -- -D warnings
        continue-on-error: true # advisory until a lint policy is decided
