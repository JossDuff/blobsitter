[package]
name = "blobsitter-testkit"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Anvil integration harness: real contracts, real blob txs, mock verifier (daemon test plan, Layer 2)"

[dependencies]
blobsitter-reference = { path = "../reference" }
c-kzg = { version = "2", features = ["ethereum_kzg_settings"] }
sha2 = "0.10"
alloy = { version = "2", features = [
    "providers",
    "contract",
    "rpc-types",
    "sol-types",
    "signers",
    "signer-local",
    "network",
    "node-bindings",
    "consensus",
    "eips",
    "rpc-types-anvil",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
tracing = "0.1"
thiserror = "2"
