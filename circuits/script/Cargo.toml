[package]
name = "blobsitter-circuits-script"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Host-side tooling: executor cycle benchmarks and vkey derivation (no proving)"

# Standalone: pulls the heavy sp1-sdk, so it stays out of the CI-tested workspace.
# Build the guests first (cd ../equivalence && cargo prove build; same for custody);
# the binaries here load the ELFs from those build outputs at runtime.
[workspace]

[dependencies]
sp1-sdk = "6.3.1"
blobsitter-circuits-common = { path = "../common" }
blobsitter-reference = { path = "../../reference" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
